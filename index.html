<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Y-bae · Ben jij een fit?</title>
<meta name="robots" content="noindex">
<style>
  :root { --green:#2f5d3a; --green2:#3f7a4c; --cream:#faf6ee; --ink:#1f2a22; --muted:#6b7a6e; --line:#e3dccd; --accent:#e9a23b; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; font-family:-apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background:var(--cream); color:var(--ink); min-height:100vh; }
  .wrap { max-width:520px; margin:0 auto; padding:20px 18px 40px; }
  header { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .logo { font-weight:800; font-size:22px; color:var(--green); letter-spacing:-.5px; }
  .logo span { color:var(--accent); }
  .step { font-size:13px; color:var(--muted); }
  .bar { height:6px; background:var(--line); border-radius:6px; overflow:hidden; margin-bottom:22px; }
  .bar i { display:block; height:100%; width:0; background:var(--green); transition:width .3s; }
  h1 { font-size:26px; line-height:1.2; margin:6px 0 10px; }
  h2 { font-size:21px; line-height:1.3; margin:0 0 6px; }
  p { line-height:1.5; }
  .hint { color:var(--muted); font-size:14px; margin:0 0 14px; }
  .tags { display:flex; flex-wrap:wrap; gap:6px; margin:14px 0 18px; }
  .tags span { background:#fff; border:1px solid var(--line); border-radius:20px; padding:5px 11px; font-size:13px; }
  .opt { display:block; width:100%; text-align:left; background:#fff; border:2px solid var(--line); border-radius:14px; padding:15px 16px; margin:0 0 10px; font-size:17px; color:var(--ink); cursor:pointer; }
  .opt.sel { border-color:var(--green); background:#eef5ee; font-weight:600; }
  .opt:active { transform:scale(.99); }
  .btn { display:block; width:100%; border:0; border-radius:14px; padding:16px; font-size:18px; font-weight:700; background:var(--green); color:#fff; cursor:pointer; margin-top:8px; }
  .btn:disabled { opacity:.4; }
  .back { background:none; border:0; color:var(--muted); font-size:15px; padding:12px 0; cursor:pointer; }
  input[type=text], input[type=email], input[type=tel], select { width:100%; font-size:17px; padding:14px; border:2px solid var(--line); border-radius:12px; background:#fff; margin:4px 0 12px; color:var(--ink); }
  label.f { font-size:14px; font-weight:600; color:var(--muted); }
  .check { display:flex; gap:10px; align-items:flex-start; font-size:15px; line-height:1.4; margin:8px 0 6px; }
  .check input { width:22px; height:22px; margin-top:1px; flex:none; }
  .err { color:#b3261e; font-size:14px; min-height:18px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:16px; padding:18px; margin:16px 0; }
  .big { font-size:52px; text-align:center; margin:10px 0 0; }
  a.link { display:block; text-align:center; color:var(--green); font-weight:700; padding:14px; border:2px solid var(--green); border-radius:14px; text-decoration:none; margin-top:10px; }
  .small { font-size:12px; color:var(--muted); line-height:1.4; }
</style>
</head>
<body>
<div class="wrap">
  <header><div class="logo">Y<span>-</span>bae</div><div class="step" id="stepTxt"></div></header>
  <div class="bar"><i id="bar"></i></div>
  <div id="app"></div>
</div>
<script src="common.js"></script>
<script>
const app = document.getElementById("app");
let A = {};          // antwoorden
let C = { naam:"", zaak:"", functie:"", email:"", gsm:"", ok:false };
let hist = [];       // gevolgde schermen
let screen = "intro";

function visibleQs() { return QUESTIONS.filter(q => !q.show || q.show(A)); }
function progress() {
  if (screen === "intro") return 0;
  if (screen === "done") return 100;
  const qs = visibleQs();
  const i = screen === "contact" ? qs.length : qs.findIndex(q => q.id === screen);
  return Math.round(((i + 1) / (qs.length + 2)) * 100);
}
function setHead() {
  document.getElementById("bar").style.width = progress() + "%";
  const qs = visibleQs();
  const i = qs.findIndex(q => q.id === screen);
  document.getElementById("stepTxt").textContent = i >= 0 ? "Vraag " + (i + 1) + " van " + qs.length : (screen === "contact" ? "Laatste stap" : "");
}
function go(next) { hist.push(screen); screen = next; render(); window.scrollTo(0, 0); }
function back() { screen = hist.pop() || "intro"; render(); }
function nextAfter(id) {
  const qs = visibleQs();
  const i = qs.findIndex(q => q.id === id);
  return qs[i + 1] ? qs[i + 1].id : "contact";
}
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c])); }

function render() {
  setHead();
  if (screen === "intro") return renderIntro();
  if (screen === "contact") return renderContact();
  if (screen === "done") return renderDone();
  renderQ(QUESTIONS.find(q => q.id === screen));
}

function renderIntro() {
  app.innerHTML = `
    <h1>Ben jij een Y-bae fit?</h1>
    <p>Broodjes en snacks die passen bij gasten met een dieetwens, en lekker voor iedereen.</p>
    <div class="tags"><span>Glutenvrij</span><span>Vegan</span><span>Koolhydraatarm</span><span>Eiwitrijk</span><span>Geen bewaarmiddelen</span></div>
    <div class="card"><b>We geven 3 proefpakketten weg</b> met al onze smaken, aan zaken waar Y-bae echt bij past. Beantwoord een paar korte vragen en ontdek of jij erbij hoort.<br><span class="small">Duurt ongeveer 1 minuut, gewoon aantikken.</span></div>
    <button class="btn" onclick="go('type')">Start</button>`;
}

function renderQ(q) {
  if (q.text) {
    app.innerHTML = `<h2>${esc(q.q)}</h2>
      <input type="text" id="t" maxlength="80" value="${esc(A[q.id] || "")}" placeholder="Naam van de groothandel">
      <button class="btn" id="nx">Verder</button>
      <button class="back" onclick="back()">← Terug</button>`;
    document.getElementById("nx").onclick = () => { A[q.id] = document.getElementById("t").value.trim(); go(nextAfter(q.id)); };
    return;
  }
  const cur = A[q.id];
  const sel = v => q.multi ? (cur || []).includes(v) : cur === v;
  app.innerHTML = `<h2>${esc(q.q)}</h2>${q.hint ? `<p class="hint">${esc(q.hint)}</p>` : `<p class="hint"></p>`}
    ${q.opts.map(o => `<button class="opt ${sel(o[0]) ? "sel" : ""}" data-v="${esc(o[0])}">${esc(o[1])}</button>`).join("")}
    ${q.multi ? `<button class="btn" id="nx" ${(cur || []).length ? "" : "disabled"}>Verder</button>` : ""}
    <button class="back" onclick="back()">← Terug</button>`;
  app.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    const v = b.dataset.v;
    if (q.multi) {
      const arr = new Set(A[q.id] || []);
      arr.has(v) ? arr.delete(v) : arr.add(v);
      A[q.id] = [...arr];
      renderQ(q);
    } else {
      A[q.id] = v;
      if (q.id === "type") { // reset routevragen bij ander type
        Object.keys(A).forEach(k => { if (k !== "type") delete A[k]; });
      }
      b.classList.add("sel");
      setTimeout(() => go(nextAfter(q.id)), 140);
    }
  });
  const nx = document.getElementById("nx");
  if (nx) nx.onclick = () => go(nextAfter(q.id));
}

function renderContact() {
  const b2b = A.type !== "particulier";
  app.innerHTML = `<h2>Bijna klaar!</h2><p class="hint">Zo kunnen we je contacteren als je geselecteerd bent.</p>
    <label class="f">Naam *</label><input type="text" id="naam" maxlength="100" autocomplete="name" value="${esc(C.naam)}">
    ${b2b ? `<label class="f">Naam van je zaak *</label><input type="text" id="zaak" maxlength="140" autocomplete="organization" value="${esc(C.zaak)}">
    <label class="f">Je functie *</label><select id="functie"><option value="">Kies…</option>${FUNCTIES.map(f => `<option value="${f[0]}" ${C.functie === f[0] ? "selected" : ""}>${f[1]}</option>`).join("")}</select>` : ""}
    <label class="f">E-mail</label><input type="email" id="email" maxlength="150" autocomplete="email" inputmode="email" value="${esc(C.email)}">
    <label class="f">Gsm</label><input type="tel" id="gsm" maxlength="30" autocomplete="tel" inputmode="tel" value="${esc(C.gsm)}">
    <label class="check"><input type="checkbox" id="ok" ${C.ok ? "checked" : ""}> <span>Ik geef Y-bae toestemming om mij te contacteren over haar producten. Mijn gegevens worden niet doorgegeven aan anderen.</span></label>
    <div class="err" id="err"></div>
    <button class="btn" id="send">Verstuur</button>
    <button class="back" onclick="back()">← Terug</button>`;
  document.getElementById("send").onclick = submit;
}

async function submit() {
  const v = id => (document.getElementById(id) || {}).value?.trim() || "";
  C = { naam: v("naam"), zaak: v("zaak"), functie: v("functie"), email: v("email"), gsm: v("gsm"), ok: document.getElementById("ok").checked };
  const err = document.getElementById("err");
  const b2b = A.type !== "particulier";
  if (!C.naam) return err.textContent = "Vul je naam in.";
  if (b2b && !C.zaak) return err.textContent = "Vul de naam van je zaak in.";
  if (b2b && !C.functie) return err.textContent = "Kies je functie.";
  if (!C.email && !C.gsm) return err.textContent = "Vul je e-mail of gsm in.";
  if (C.email && !/^\S+@\S+\.\S+$/.test(C.email)) return err.textContent = "Dit e-mailadres klopt niet.";
  if (!C.ok) return err.textContent = "Vink de toestemming aan om te versturen.";
  err.textContent = "";
  const btn = document.getElementById("send"); btn.disabled = true; btn.textContent = "Bezig…";
  const answers = { ...A, functie: C.functie };
  answers._score = scoreParts(answers).score;
  try {
    await sb("/rest/v1/ybae_leads", { method: "POST", headers: { Prefer: "return=minimal" },
      body: JSON.stringify({ naam: C.naam, zaak: C.zaak || null, email: C.email || null, gsm: C.gsm || null, toestemming: true, answers }) });
    hist = []; go("done");
  } catch (e) {
    btn.disabled = false; btn.textContent = "Verstuur";
    err.textContent = "Versturen lukte niet. Probeer opnieuw of laat het weten aan de stand.";
  }
}

function renderDone() {
  const part = A.type === "particulier";
  document.getElementById("stepTxt").textContent = "";
  app.innerHTML = `<div class="big">🙌</div><h1 style="text-align:center">Bedankt, ${esc(C.naam.split(" ")[0])}!</h1>
    ${part
      ? `<p>Leuk dat je Y-bae wil leren kennen. De proefpakketten gaan naar zaken, maar in de webshop vind je al onze buns, mixen en snacks.</p>`
      : `<p>We bekijken alle antwoorden na de beurs en selecteren de <b>3 zaken</b> waar Y-bae het best bij past. Ben jij erbij, dan nemen we contact op om je proefpakket te bezorgen.</p>
         <p>Kom zeker even proeven aan de stand en vraag naar Heidi.</p>`}
    <a class="link" href="https://youbae.be" target="_blank" rel="noopener">Bekijk de webshop</a>`;
}

render();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Y-bae</title>
<meta name="robots" content="noindex">
<style>
  :root { --green:#2f5d3a; --cream:#faf6ee; --ink:#1f2a22; --muted:#6b7a6e; --line:#e3dccd; --accent:#e9a23b; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; font-family:-apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background:var(--cream); color:var(--ink); min-height:100vh; }
  .wrap { max-width:520px; margin:0 auto; padding:16px 18px 40px; }
  header { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; gap:10px; }
  .logo { font-weight:800; font-size:22px; color:var(--green); letter-spacing:-.5px; }
  .logo span { color:var(--accent); }
  .langs { display:flex; gap:4px; }
  .langs button { border:1px solid var(--line); background:#fff; border-radius:8px; padding:6px 9px; font-size:13px; font-weight:700; color:var(--muted); cursor:pointer; }
  .langs button.on { background:var(--green); color:#fff; border-color:var(--green); }
  .step { font-size:13px; color:var(--muted); min-height:16px; margin-bottom:6px; }
  .bar { height:6px; background:var(--line); border-radius:6px; overflow:hidden; margin-bottom:20px; }
  .bar i { display:block; height:100%; width:0; background:var(--green); transition:width .3s; }
  h1 { font-size:26px; line-height:1.2; margin:6px 0 10px; }
  h2 { font-size:21px; line-height:1.3; margin:0 0 6px; }
  p { line-height:1.5; }
  .hint { color:var(--muted); font-size:14px; margin:0 0 14px; }
  .tags { display:flex; flex-wrap:wrap; gap:6px; margin:14px 0 18px; }
  .tags span { background:#fff; border:1px solid var(--line); border-radius:20px; padding:5px 11px; font-size:13px; }
  .opt { display:block; width:100%; text-align:left; background:#fff; border:2px solid var(--line); border-radius:14px; padding:15px 16px; margin:0 0 10px; font-size:17px; color:var(--ink); cursor:pointer; }
  .opt.sel { border-color:var(--green); background:#eef5ee; font-weight:600; }
  .btn { display:block; width:100%; border:0; border-radius:14px; padding:16px; font-size:18px; font-weight:700; background:var(--green); color:#fff; cursor:pointer; margin-top:8px; text-align:center; text-decoration:none; }
  .btn:disabled { opacity:.4; }
  .btn.insta { background:linear-gradient(90deg,#f58529,#dd2a7b,#8134af); }
  .btn.shop { background:#fff; color:var(--green); border:2px solid var(--green); }
  .back { background:none; border:0; color:var(--muted); font-size:15px; padding:12px 0; cursor:pointer; }
  input[type=text], input[type=email], input[type=tel], select { width:100%; font-size:17px; padding:14px; border:2px solid var(--line); border-radius:12px; background:#fff; margin:4px 0 12px; color:var(--ink); }
  label.f { font-size:14px; font-weight:600; color:var(--muted); }
  .check { display:flex; gap:10px; align-items:flex-start; font-size:15px; line-height:1.4; margin:8px 0 6px; }
  .check input { width:22px; height:22px; margin-top:1px; flex:none; }
  .err { color:#b3261e; font-size:14px; min-height:18px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:16px; padding:18px; margin:16px 0; }
  .big { font-size:52px; text-align:center; margin:10px 0 0; }
  .small { font-size:12px; color:var(--muted); line-height:1.4; }
  .choose { font-weight:700; margin:22px 0 6px; text-align:center; }
</style>
</head>
<body>
<div class="wrap">
  <header><div class="logo">Y<span>-</span>bae</div>
    <div class="langs" id="langs"><button data-l="nl">NL</button><button data-l="fr">FR</button><button data-l="en">EN</button></div></header>
  <div class="step" id="stepTxt"></div>
  <div class="bar"><i id="bar"></i></div>
  <div id="app"></div>
</div>
<script src="common.js"></script>
<script src="i18n.js"></script>
<script>
const app = document.getElementById("app");
let A = {};
let C = { naam:"", zaak:"", functie:"", email:"", gsm:"", ok:false };
let hist = [];
let screen = "intro";
let L = "nl";
try { const n = (navigator.language || "nl").slice(0, 2); if (n === "fr" || n === "en") L = n; } catch (e) {}
const U = () => UI[L];

document.querySelectorAll("#langs button").forEach(b => b.onclick = () => { readContact(); L = b.dataset.l; render(); });

function visibleQs() { return QUESTIONS.filter(q => !q.show || q.show(A)); }
function progress() {
  if (screen === "intro") return 0;
  if (screen === "done") return 100;
  const qs = visibleQs();
  const i = screen === "contact" ? qs.length : qs.findIndex(q => q.id === screen);
  return Math.round(((i + 1) / (qs.length + 2)) * 100);
}
function setHead() {
  document.documentElement.lang = L;
  document.title = "Y-bae · " + U().title;
  document.querySelectorAll("#langs button").forEach(b => b.classList.toggle("on", b.dataset.l === L));
  document.getElementById("bar").style.width = progress() + "%";
  const qs = visibleQs();
  const i = qs.findIndex(q => q.id === screen);
  document.getElementById("stepTxt").textContent = i >= 0 ? U().question + " " + (i + 1) + " " + U().of + " " + qs.length : (screen === "contact" ? U().last : "");
}
function go(next) { hist.push(screen); screen = next; render(); window.scrollTo(0, 0); }
function back() { readContact(); screen = hist.pop() || "intro"; render(); }
function nextAfter(id) {
  const qs = visibleQs();
  const i = qs.findIndex(q => q.id === id);
  return qs[i + 1] ? qs[i + 1].id : "contact";
}
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c])); }

function render() {
  setHead();
  if (screen === "intro") return renderIntro();
  if (screen === "contact") return renderContact();
  if (screen === "done") return renderDone();
  renderQ(QUESTIONS.find(q => q.id === screen));
}

function renderIntro() {
  const u = U();
  app.innerHTML = `
    <h1>${u.title}</h1>
    <p>${u.intro}</p>
    <div class="tags">${u.tags.map(t => `<span>${t}</span>`).join("")}</div>
    <div class="card">${u.card}<br><span class="small">${u.cardSmall}</span></div>
    <button class="btn" onclick="go('type')">${u.start}</button>`;
}

function renderQ(q) {
  const u = U();
  if (q.text) {
    app.innerHTML = `<h2>${esc(tq(L, q))}</h2>
      <input type="text" id="t" maxlength="80" value="${esc(A[q.id] || "")}" placeholder="${u.otherPh}">
      <button class="btn" id="nx">${u.next}</button>
      <button class="back" onclick="back()">${u.back}</button>`;
    document.getElementById("nx").onclick = () => { A[q.id] = document.getElementById("t").value.trim(); go(nextAfter(q.id)); };
    return;
  }
  const cur = A[q.id];
  const sel = v => q.multi ? (cur || []).includes(v) : cur === v;
  app.innerHTML = `<h2>${esc(tq(L, q))}</h2><p class="hint">${q.multi ? u.multi : ""}</p>
    ${q.opts.map(o => `<button class="opt ${sel(o[0]) ? "sel" : ""}" data-v="${esc(o[0])}">${esc(topt(L, q.id, o[0], o[1]))}</button>`).join("")}
    ${q.multi ? `<button class="btn" id="nx" ${(cur || []).length ? "" : "disabled"}>${u.next}</button>` : ""}
    <button class="back" onclick="back()">${u.back}</button>`;
  app.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    const v = b.dataset.v;
    if (q.multi) {
      const arr = new Set(A[q.id] || []);
      arr.has(v) ? arr.delete(v) : arr.add(v);
      A[q.id] = [...arr];
      renderQ(q);
    } else {
      if (q.id === "type" && A.type !== v) Object.keys(A).forEach(k => delete A[k]);
      A[q.id] = v;
      b.classList.add("sel");
      setTimeout(() => go(nextAfter(q.id)), 140);
    }
  });
  const nx = document.getElementById("nx");
  if (nx) nx.onclick = () => go(nextAfter(q.id));
}

function readContact() {
  if (screen !== "contact") return;
  const v = id => (document.getElementById(id) || {}).value?.trim() ?? "";
  const ok = document.getElementById("ok");
  C = { naam: v("naam"), zaak: v("zaak"), functie: v("functie"), email: v("email"), gsm: v("gsm"), ok: ok ? ok.checked : false };
}

function renderContact() {
  const u = U();
  const b2b = A.type !== "particulier";
  app.innerHTML = `<h2>${u.almost}</h2><p class="hint">${u.almostSub}</p>
    <label class="f">${u.name}</label><input type="text" id="naam" maxlength="100" autocomplete="name" value="${esc(C.naam)}">
    ${b2b ? `<label class="f">${u.biz}</label><input type="text" id="zaak" maxlength="140" autocomplete="organization" value="${esc(C.zaak)}">
    <label class="f">${u.role}</label><select id="functie"><option value="">${u.choose}</option>${FUNCTIES.map(f => `<option value="${f[0]}" ${C.functie === f[0] ? "selected" : ""}>${esc(topt(L, "functie", f[0], f[1]))}</option>`).join("")}</select>` : ""}
    <label class="f">${u.email}</label><input type="email" id="email" maxlength="150" autocomplete="email" inputmode="email" value="${esc(C.email)}">
    <label class="f">${u.gsm}</label><input type="tel" id="gsm" maxlength="30" autocomplete="tel" inputmode="tel" value="${esc(C.gsm)}">
    <label class="check"><input type="checkbox" id="ok" ${C.ok ? "checked" : ""}> <span>${u.consent}</span></label>
    <div class="err" id="err"></div>
    <button class="btn" id="send">${u.send}</button>
    <button class="back" onclick="back()">${u.back}</button>`;
  document.getElementById("send").onclick = submit;
}

async function submit() {
  const u = U();
  readContact();
  const err = document.getElementById("err");
  const b2b = A.type !== "particulier";
  if (!C.naam) return err.textContent = u.eName;
  if (b2b && !C.zaak) return err.textContent = u.eBiz;
  if (b2b && !C.functie) return err.textContent = u.eRole;
  if (!C.email && !C.gsm) return err.textContent = u.eContact;
  if (C.email && !/^\S+@\S+\.\S+$/.test(C.email)) return err.textContent = u.eMail;
  if (!C.ok) return err.textContent = u.eConsent;
  err.textContent = "";
  const btn = document.getElementById("send"); btn.disabled = true; btn.textContent = u.busy;
  const answers = { ...A, functie: C.functie, taal: L };
  answers._score = scoreParts(answers).score;
  try {
    await sb("/rest/v1/ybae_leads", { method: "POST", headers: { Prefer: "return=minimal" },
      body: JSON.stringify({ naam: C.naam, zaak: C.zaak || null, email: C.email || null, gsm: C.gsm || null, toestemming: true, answers }) });
    hist = []; go("done");
  } catch (e) {
    btn.disabled = false; btn.textContent = u.send;
    err.textContent = u.eSend;
  }
}

function renderDone() {
  const u = U();
  const part = A.type === "particulier";
  document.getElementById("stepTxt").textContent = "";
  app.innerHTML = `<div class="big">🙌</div><h1 style="text-align:center">${u.thanks}, ${esc(C.naam.split(" ")[0])}!</h1>
    ${part ? `<p>${u.donePart}</p>` : `<p>${u.doneB2b}</p><p>${u.doneTaste}</p>`}
    <p class="choose">${u.choosePrompt}</p>
    <a class="btn insta" href="${INSTAGRAM_URL}" target="_blank" rel="noopener">${u.insta}</a>
    <a class="btn shop" href="${WEBSHOP_URL}" target="_blank" rel="noopener">${u.shop}</a>`;
}

render();
</script>
</body>
</html>

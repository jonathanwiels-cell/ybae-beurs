<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Y-bae · QR voor de stand</title>
<meta name="robots" content="noindex">
<style>
  @page { size: A4; margin: 0; }
  body { margin:0; font-family:-apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background:#faf6ee; color:#1f2a22; }
  .poster { width:210mm; min-height:297mm; margin:0 auto; padding:22mm 18mm; box-sizing:border-box; text-align:center; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .logo { font-weight:800; font-size:64px; color:#2f5d3a; letter-spacing:-1px; }
  .logo span { color:#e9a23b; }
  h1 { font-size:46px; margin:10px 0 6px; line-height:1.1; }
  .sub { font-size:22px; color:#4b5a4f; margin:0 0 26px; }
  .qr { background:#fff; padding:18px; border-radius:24px; }
  .qr img { width:105mm; height:105mm; display:block; }
  .tags { margin-top:26px; font-size:20px; color:#2f5d3a; font-weight:700; }
  .foot { margin-top:18px; font-size:17px; color:#6b7a6e; }
  .print { margin:16px auto; display:block; padding:12px 22px; font-size:16px; border:0; border-radius:12px; background:#2f5d3a; color:#fff; }
  @media print { .print { display:none; } body { -webkit-print-color-adjust:exact; print-color-adjust:exact; } }
</style>
</head>
<body>
<button class="print" onclick="window.print()">Afdrukken</button>
<div class="poster">
  <div class="logo">Y<span>-</span>bae</div>
  <h1>Ben jij een Y-bae fit?</h1>
  <p class="sub">Scan, beantwoord een paar korte vragen<br>en ontdek of jouw zaak bij de <b>3 geselecteerde</b> hoort<br>voor een gratis proefpakket.</p>
  <div class="qr"><img src="https://api.qrserver.com/v1/create-qr-code/?size=800x800&margin=10&color=2f5d3a&data=https%3A%2F%2Fjonathanwiels-cell.github.io%2Fybae-beurs%2F" alt="QR-code naar de Y-bae quiz"></div>
  <div class="tags">Glutenvrij · Vegan · Koolhydraatarm · Eiwitrijk</div>
  <div class="foot">jonathanwiels-cell.github.io/ybae-beurs · we selecteren op de beste fit</div>
</div>
</body>
</html>
